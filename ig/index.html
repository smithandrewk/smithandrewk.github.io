<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Redirecting…</title>
<!-- Instagram bio link target. Redirects to the homepage with UTM tags so Vantage
     attributes the visit to Instagram; the tapped link itself stays clean (/ig). -->
<meta http-equiv="refresh" content="0; url=/?utm_source=instagram&utm_medium=bio" />
<link rel="canonical" href="https://smithandrew.com/" />
<script>
  location.replace("/?utm_source=instagram&utm_medium=bio");
</script>
</head>
<body>
<p>Redirecting to <a href="/?utm_source=instagram&utm_medium=bio">smithandrew.com</a>…</p>
</body>
</html>
