<!doctype html><meta charset="utf-8"><title>Moog audio audit</title>
<h1>Offline audio verification</h1><p>Render the actual synthesizer graph without playing sound.</p>
<button id="run">Run audio checks</button><pre id="result">Not run</pre>
<script type="module">
import { makeVoiceGraph, noteFrequency, filterFrequency } from '../src/scripts/voxel/synth.js';
document.querySelector('#run').onclick = async () => {
  const results = [];
  for (const cutoff of [.08, .52, .95]) for (const room of [false, true]) {
    const rate = 44100, context = new OfflineAudioContext(2, rate * 4, rate), graph = makeVoiceGraph(context);
    if (!room) graph.reverbWet.gain.value = 0;
    for (const { oscillator, octave } of graph.oscillators) oscillator.frequency.value = noteFrequency(60) * octave;
    graph.filter.frequency.value = filterFrequency(cutoff); graph.second.frequency.value = filterFrequency(cutoff) * 1.25;
    graph.amp.gain.setTargetAtTime(.24, .2, .012); graph.amp.gain.setTargetAtTime(0, 1.2, .075);
    const rendered = await context.startRendering(), samples = rendered.getChannelData(0), right = rendered.getChannelData(1);
    const rms = (a, b) => Math.sqrt(samples.slice(a * rate, b * rate).reduce((sum, v) => sum + v * v, 0) / ((b - a) * rate));
    let peak = 0, derivative = 0, width = 0;
    for (let i = 0; i < samples.length; i++) peak = Math.max(peak, Math.abs(samples[i]), Math.abs(right[i]));
    for (let i = rate / 2; i < rate; i++) { derivative += Math.abs(samples[i] - samples[i - 1]); width += (samples[i] - right[i]) ** 2; }
    results.push({ cutoff, room, peak, rms: rms(.5, 1), silence: rms(0, .19), decay: rms(1.9, 2.3), tail: rms(3.6, 4), width: Math.sqrt(width / (rate / 2)), brightness: derivative / (rate / 2) });
  }
  const dry = results.find(r => r.cutoff === .52 && !r.room), wet = results.find(r => r.cutoff === .52 && r.room);
  const pass = results.every(r => r.peak > .005 && r.peak < .8 && r.silence === 0 && r.tail < .000001)
    && results[5].brightness > results[1].brightness * 2 && wet.decay > Math.max(.00001, dry.decay * 8) && wet.width > .001;
  document.querySelector('#result').textContent = JSON.stringify({ pass, results }, null, 2);
};
</script>
